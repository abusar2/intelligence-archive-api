services:
type: web name: intelligence-archive-api runtime: python plan: free autoDeploy: true buildCommand: pip install -r requirements.txt startCommand: gunicorn -b 0.0.0.0:10000 backend:app envVars:
key: UPSTREAM_BASE_URL value: https://zezsoft.eu
key: UPSTREAM_USER value: ZezsoftUser@2025
key: UPSTREAM_PASS value: Zezsoft$Pass#2025
key: UPSTREAM_TIMEOUT value: 20
key: PORT value: 10000
key: ALLOWED_ORIGINS value: *
